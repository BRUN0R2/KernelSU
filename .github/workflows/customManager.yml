name: Custom ARM64 Manager

on:
  push:
    branches: [customManager]
    paths:
      - .github/workflows/customManager.yml
      - .github/workflows/ddk-lkm.yml
      - .github/workflows/ksuinit.yml
      - .github/scripts/setup-rust-build.sh
      - customManager/config.json
      - customManager/certificate.pem
      - customManager/prepare.py
      - manager/**
      - kernel/**
      - userspace/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customManager-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      packageName: ${{ steps.config.outputs.packageName }}
      displayName: ${{ steps.config.outputs.displayName }}
      kmi: ${{ steps.config.outputs.kmi }}
      ddkRelease: ${{ steps.config.outputs.ddkRelease }}
      abi: ${{ steps.config.outputs.abi }}
      certificateSize: ${{ steps.config.outputs.certificateSize }}
      certificateSha256: ${{ steps.config.outputs.certificateSha256 }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate public configuration
        id: config
        run: python3 customManager/prepare.py

  kernel:
    needs: configure
    uses: ./.github/workflows/ddk-lkm.yml
    with:
      kmi: ${{ needs.configure.outputs.kmi }}
      ddk_release: ${{ needs.configure.outputs.ddkRelease }}
      package_name: ${{ needs.configure.outputs.packageName }}
      expected_size: ${{ needs.configure.outputs.certificateSize }}
      expected_hash: ${{ needs.configure.outputs.certificateSha256 }}

  init:
    uses: ./.github/workflows/ksuinit.yml

  userspace:
    needs: [configure, kernel, init]
    runs-on: ubuntu-latest
    env:
      KSU_PACKAGE_NAME: ${{ needs.configure.outputs.packageName }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: aarch64-${{ needs.configure.outputs.kmi }}-lkm
          path: userspace/ksud/bin/aarch64
      - uses: actions/download-artifact@v8
        with:
          name: ksuinit-aarch64
          path: userspace/ksud/bin/aarch64
      - name: Set up Rust
        run: |
          rustup update stable
          rustup target add aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Build daemon with matching kernel module
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
          cargo build --locked --target "$TRIPLE" --release --package ksud
      - uses: actions/upload-artifact@v7
        with:
          name: customManagerKsud
          path: target/aarch64-linux-android/release/ksud

  manager:
    needs: [configure, userspace]
    runs-on: ubuntu-latest
    env:
      MANAGER_PACKAGE: ${{ needs.configure.outputs.packageName }}
      MANAGER_NAME: ${{ needs.configure.outputs.displayName }}
      MANAGER_ABI: ${{ needs.configure.outputs.abi }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          name: customManagerKsud
          path: daemon
      - uses: actions/download-artifact@v8
        with:
          name: aarch64-${{ needs.configure.outputs.kmi }}-lkm
          path: compiledKernel
      - name: Stage daemon before Gradle
        run: |
          install -Dm755 daemon/ksud "manager/app/src/main/jniLibs/$MANAGER_ABI/libksud.so"
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'cmake;3.22.1'
      - name: Build and lint unsigned manager
        working-directory: manager
        run: |
          ./gradlew assembleRelease lintRelease --no-daemon \
            -PKSU_PACKAGE_NAME="$MANAGER_PACKAGE" \
            -PKSU_NAME="$MANAGER_NAME" \
            -PKSU_ABIS="$MANAGER_ABI"
      - name: Verify artifact and record provenance
        run: |
          mkdir -p customManagerOutput
          mapfile -t packages < <(find manager/app/build/outputs/apk/release -maxdepth 1 -name '*.apk')
          test "${#packages[@]}" -eq 1
          apk="${packages[0]}"
          test "$(apkanalyzer manifest application-id "$apk")" = "$MANAGER_PACKAGE"
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 "$apk"
          cp "$apk" customManagerOutput/deviceAccess-unsigned.apk
          cp customManager/certificate.pem customManagerOutput/
          cp compiledKernel/*_kernelsu.ko customManagerOutput/
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          import zipfile
          sys.path.insert(0, "customManager")
          from prepare import prepare
          metadata = prepare()
          metadata["sourceCommit"] = os.environ["GITHUB_SHA"]
          metadata["buildUrl"] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          metadata["unsignedApkSha256"] = hashlib.sha256(Path("customManagerOutput/deviceAccess-unsigned.apk").read_bytes()).hexdigest()
          metadata["kernelSha256"] = hashlib.sha256(next(Path("compiledKernel").glob("*_kernelsu.ko")).read_bytes()).hexdigest()
          metadata["daemonSha256"] = hashlib.sha256(Path("daemon/ksud").read_bytes()).hexdigest()
          with zipfile.ZipFile("customManagerOutput/deviceAccess-unsigned.apk") as apk:
              libraries = [name for name in apk.namelist() if name.startswith("lib/")]
              assert libraries and all(name.startswith("lib/arm64-v8a/") for name in libraries)
              assert "lib/arm64-v8a/libksud.so" in libraries
          Path("customManagerOutput/buildMetadata.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: customManagerUnsigned
          path: customManagerOutput
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: customManagerLint
          path: manager/app/build/reports/lint-results-release.*
          if-no-files-found: ignore
